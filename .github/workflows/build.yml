name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet supabase pillow

      - name: Prepare main.py, requirements, and valid PNG icon
        run: |
          if [ -f "main.py.py" ] && [ ! -f "main.py" ]; then cp "main.py.py" "main.py"; fi
          rm -f "main.py.py"
          printf "flet\nsupabase\n" > requirements.txt

          python3 - << 'EOF'
          import pathlib
          from PIL import Image

          # 1. تصحيح أي مسافة بادئة زائدة في main.py والتأكد من سلامة الكود
          p = pathlib.Path("main.py")
          code = p.read_text(encoding="utf-8")
          code = code.replace("         dash_items = [", "        dash_items = [")
          p.write_text(code, encoding="utf-8")
          compile(code, "main.py", "exec")
          print("main.py syntax verified successfully!")

          # 2. فحص وتحويل اللوجو إلى PNG قياسي 512x512 لمنع فشل البناء
          assets_dir = pathlib.Path("assets")
          assets_dir.mkdir(exist_ok=True)
          for candidate in ["icon.png", "logo.png", "icon.jpg", "logo.jpg", "assets/icon.png"]:
              cp = pathlib.Path(candidate)
              if cp.exists():
                  try:
                      img = Image.open(cp).convert("RGBA")
                      img = img.resize((512, 512))
                      img.save(assets_dir / "icon.png", format="PNG")
                      print(f"Converted {candidate} to valid 512x512 assets/icon.png")
                      break
                  except Exception as e:
                      print(f"Skipping invalid image {candidate}: {e}")
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: |
          flet build apk --yes --project "KeyanEast" --org "com.keyaneast.app" -v || flet build apk --yes -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keyan-East-App
          path: build/apk/**/*.apk
