name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet supabase

      - name: Auto-fix all Flet 1.0 breaking changes
        run: |
          python3 - << 'EOF'
          import pathlib, re

          candidates = [p for p in [pathlib.Path("main.py"), pathlib.Path("main.py.py")] if p.exists()]
          valid_files = [p for p in candidates if "YOUR_SUPABASE_URL" not in p.read_text(encoding="utf-8")]
          chosen = valid_files[0] if valid_files else candidates[0]
          code = chosen.read_text(encoding="utf-8")

          code = code.replace("ft.icons.", "ft.Icons.")
          code = code.replace("ft.colors.", "ft.Colors.")
          code = code.replace("ft.ImageFit.", "ft.BoxFit.")
          code = code.replace("LOCK_PERSON", "LOCK")
          code = code.replace("width=float('inf')", "width=350")
          code = re.sub(r'ft\.ElevatedButton\(\s*text\s*=\s*', 'ft.ElevatedButton(', code)

          code = re.sub(
              r'page\.dialog\s*=\s*dlg\s*\n\s*dlg\.open\s*=\s*True\s*\n\s*page\.update\(\)',
              '_open_dlg(page, dlg)',
              code
          )
          code = code.replace("page.dialog.open = False", "_close_dlg(page, dlg)")
          code = code.replace("setattr(page.dialog, 'open', False) or page.update()", "_close_dlg(page, dlg)")
          code = code.replace(
              "page.overlay.append(ft.SnackBar(ft.Text(msg), bgcolor=color, open=True))\n        page.update()",
              "_open_dlg(page, ft.SnackBar(ft.Text(msg), bgcolor=color, open=True))"
          )

          shim_lines = [
              "import flet as ft",
              "import inspect",
              "from supabase import create_client, Client",
              "",
              "if hasattr(ft, 'Icons'): ft.icons = ft.Icons",
              "if hasattr(ft, 'Colors'): ft.colors = ft.Colors",
              "if hasattr(ft, 'BoxFit'): ft.ImageFit = ft.BoxFit",
              "if hasattr(ft, 'Margin'):",
              "    ft.margin = ft.Margin",
              "    if not hasattr(ft.margin, 'only'):",
              "        ft.margin.only = staticmethod(lambda left=0, top=0, right=0, bottom=0: ft.Margin(left=left, top=top, right=right, bottom=bottom))",
              "    if not hasattr(ft.margin, 'symmetric'):",
              "        ft.margin.symmetric = staticmethod(lambda vertical=0, horizontal=0: ft.Margin(left=horizontal, top=vertical, right=horizontal, bottom=vertical))",
              "if hasattr(ft, 'Padding'): ft.padding = ft.Padding",
              "",
              "_BtnCls = getattr(ft, 'ElevatedButton', None) or getattr(ft, 'Button', None) or getattr(ft, 'FilledButton', None)",
              "def _compat_elevated_button(*args, **kwargs):",
              "    sig = inspect.signature(_BtnCls.__init__).parameters",
              "    if 'text' in kwargs and 'text' not in sig:",
              "        t = kwargs.pop('text')",
              "        if not args:",
              "            args = (t,)",
              "    if kwargs.get('width') == float('inf'):",
              "        kwargs['width'] = 350",
              "    bg = kwargs.get('bgcolor')",
              "    fg = kwargs.get('color')",
              "    if ('bgcolor' not in sig or 'color' not in sig) and hasattr(ft, 'ButtonStyle'):",
              "        kwargs.pop('bgcolor', None)",
              "        kwargs.pop('color', None)",
              "        kwargs['style'] = ft.ButtonStyle(bgcolor=bg, color=fg)",
              "    valid = {k: v for k, v in kwargs.items() if k in sig or any(p.kind == inspect.Parameter.VAR_KEYWORD for p in sig.values())}",
              "    return _BtnCls(*args, **valid)",
              "ft.ElevatedButton = _compat_elevated_button",
              "",
              "_OrigTF = ft.TextField",
              "def _compat_textfield(*args, **kwargs):",
              "    sig = inspect.signature(_OrigTF.__init__).parameters",
              "    if 'icon' in kwargs and 'icon' not in sig and 'prefix_icon' in sig:",
              "        kwargs['prefix_icon'] = kwargs.pop('icon')",
              "    valid = {k: v for k, v in kwargs.items() if k in sig or any(p.kind == inspect.Parameter.VAR_KEYWORD for p in sig.values())}",
              "    return _OrigTF(*args, **valid)",
              "ft.TextField = _compat_textfield",
              "",
              "_OrigImg = ft.Image",
              "def _compat_image(*args, **kwargs):",
              "    sig = inspect.signature(_OrigImg.__init__).parameters",
              "    valid = {k: v for k, v in kwargs.items() if k in sig or any(p.kind == inspect.Parameter.VAR_KEYWORD for p in sig.values())}",
              "    return _OrigImg(*args, **valid)",
              "ft.Image = _compat_image",
              "",
              "def _open_dlg(page, dlg):",
              "    page.dialog = dlg",
              "    dlg.open = True",
              "    for m in ('show_dialog', 'open'):",
              "        if hasattr(page, m):",
              "            try:",
              "                getattr(page, m)(dlg)",
              "                return",
              "            except Exception:",
              "                pass",
              "    if dlg not in page.overlay:",
              "        page.overlay.append(dlg)",
              "    page.update()",
              "",
              "def _close_dlg(page, dlg=None):",
              "    target = dlg or getattr(page, 'dialog', None)",
              "    if target:",
              "        target.open = False",
              "    for m in ('pop_dialog', 'close'):",
              "        if hasattr(page, m):",
              "            try:",
              "                getattr(page, m)() if m == 'pop_dialog' else getattr(page, m)(target)",
              "                return",
              "            except Exception:",
              "                pass",
              "    page.update()",
              "",
              "if not hasattr(ft, 'app') and hasattr(ft, 'run'):",
              "    ft.app = lambda target, **k: ft.run(target)",
              "",
              ""
          ]

          shim_clean = "\n".join(shim_lines)
          code = re.sub(r'import flet as ft[\s\S]*?(?=SUPABASE_URL)', lambda _: shim_clean, code, count=1)

          pathlib.Path("main.py.py").unlink(missing_ok=True)
          pathlib.Path("main.py").write_text(code, encoding="utf-8")

          compile(code, "main.py", "exec")
          print("All Flet 1.0 patches compiled and verified successfully!")
          EOF
          printf "flet\nsupabase\n" > requirements.txt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          set +o pipefail
          yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: |
          set +o pipefail
          yes | flet build apk -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keyan-East-App
          path: build/apk/**/*.apk
