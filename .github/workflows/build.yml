name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auto-fix code for Flet 1.0 compatibility
        run: |
          python3 - << 'EOF'
          import pathlib, re

          # اختيار الملف الذي يحتوي على مفاتيح Supabase الصحيحة
          candidates = [pathlib.Path("main.py"), pathlib.Path("main.py.py")]
          existing = [p for p in candidates if p.exists()]
          chosen = existing[0]
          for p in existing:
              txt = p.read_text(encoding="utf-8")
              if "YOUR_SUPABASE_URL" not in txt:
                  chosen = p
                  break

          code = chosen.read_text(encoding="utf-8")

          # تحويل شامل ومباشر لكل الأيقونات والألوان والنوافذ لتعمل مع Flet 1.0.4
          code = code.replace("ft.icons.", "ft.Icons.")
          code = code.replace("ft.colors.", "ft.Colors.")
          code = code.replace("ft.ImageFit.", "ft.BoxFit.")
          code = code.replace("LOCK_PERSON", "LOCK")
          code = re.sub(r'ft\.ElevatedButton\(\s*text\s*=\s*', 'ft.ElevatedButton(', code)
          code = code.replace("page.dialog = dlg", "page.overlay.append(dlg) if dlg not in page.overlay else None; page.dialog = dlg")

          shim = """import flet as ft
          if hasattr(ft, "Icons"): ft.icons = ft.Icons
          if hasattr(ft, "Colors"): ft.colors = ft.Colors
          if hasattr(ft, "BoxFit"): ft.ImageFit = ft.BoxFit
          if not hasattr(ft, "app") and hasattr(ft, "run"): ft.app = lambda target, **k: ft.run(target)
          """
          code = code.replace("import flet as ft", shim, 1)

          # حذف الملف المكرر إن وجد واعتماد main.py فقط
          if pathlib.Path("main.py.py").exists():
              pathlib.Path("main.py.py").unlink()
          pathlib.Path("main.py").write_text(code, encoding="utf-8")
          print(f"Successfully upgraded {chosen} -> main.py")
          EOF
          printf "flet\nsupabase\n" > requirements.txt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          set +o pipefail
          yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet supabase

      - name: Build APK
        run: |
          set +o pipefail
          yes | flet build apk -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keyan-East-App
          path: build/apk/**/*.apk
