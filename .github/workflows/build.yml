name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure main.py and requirements.txt
        run: |
          if [ -f "main.py.py" ] && [ ! -f "main.py" ]; then cp "main.py.py" "main.py"; fi
          rm -f "main.py.py"
          printf "flet\nsupabase\n" > requirements.txt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          set +o pipefail
          yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet supabase

      - name: Build APK
        run: |
          set +o pipefail
          yes | flet build apk -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keyan-East-App
          path: build/apk/**/*.apk
